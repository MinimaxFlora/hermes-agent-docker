name: Bug report
description: 构建、发布流程或镜像运行异常
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。本仓库只负责镜像的构建与发布；Hermes Agent 应用本身的问题请提交到上游仓库。
        提交前请先搜索是否已有相同 Issue。

  - type: input
    id: image
    attributes:
      label: 镜像与标签
      description: 例如 dockorae/hermes-agent:0.22.2 或 ghcr.io/minimaxflora/hermes-agent:latest
      placeholder: dockorae/hermes-agent:latest
    validations:
      required: true

  - type: dropdown
    id: architecture
    attributes:
      label: 架构
      options:
        - linux/amd64
        - linux/arm64
        - 其他
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 期望行为与实际行为
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 完整的启动命令、compose 配置或工作流触发方式
      render: shell
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志
      description: 请粘贴相关输出，注意删除 API Key、Token 等敏感信息
      render: shell
    validations:
      required: false

  - type: input
    id: workflow
    attributes:
      label: 相关 Workflow 运行链接
      description: 如果是构建或发布失败，请附上 Actions 运行链接
      placeholder: https://github.com/MinimaxFlora/hermes-agent-docker/actions/runs/...
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 我已搜索过现有 Issue
          required: true
        - label: 日志中不包含真实凭据
          required: true
